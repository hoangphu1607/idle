<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 100" width="680" height="100">
  <defs>
    <!-- Gradient khung viền ngoài -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a8288" />
      <stop offset="50%" stop-color="#3a4046" />
      <stop offset="100%" stop-color="#1e2226" />
    </linearGradient>

    <!-- Gradient góc kim loại highlight -->
    <linearGradient id="cornerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1d6dc" />
      <stop offset="100%" stop-color="#4a525d" />
    </linearGradient>

    <!-- Nền lõi của ô chứa đồ -->
    <radialGradient id="slotBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2329" />
      <stop offset="100%" stop-color="#0d1013" />
    </radialGradient>

    <!-- Bộ khung cơ sở kích thước 80x80 -->
    <g id="base-slot">
      <!-- Đổ bóng & Viền ngoài -->
      <rect x="0" y="0" width="80" height="80" rx="8" fill="url(#borderGrad)" stroke="#111417" stroke-width="2" />
      <!-- Lòng ô cắm item -->
      <rect x="5" y="5" width="70" height="70" rx="5" fill="url(#slotBg)" stroke="#2f3842" stroke-width="1.5" />
      <!-- Chi tiết 4 góc kim loại tăng chất RPG -->
      <polygon points="5,5 15,5 5,15" fill="url(#cornerGrad)" opacity="0.6" />
      <polygon points="75,5 65,5 75,15" fill="url(#cornerGrad)" opacity="0.6" />
      <polygon points="5,75 15,75 5,65" fill="url(#cornerGrad)" opacity="0.6" />
      <polygon points="75,75 65,75 75,65" fill="url(#cornerGrad)" opacity="0.6" />
      <!-- Đường rãnh chìm tinh tế -->
      <rect x="9" y="9" width="62" height="62" rx="3" fill="none" stroke="#000" stroke-width="1" opacity="0.5" />
    </g>

    <!-- Màu icon mờ mặc định -->
    <style>
      .slot-icon { fill: #485666; opacity: 0.55; }
    </style>
  </defs>

  <!-- ================= 1. NÓN / MŨ (HELMET) ================= -->
  <g transform="translate(10, 10)">
    <use href="#base-slot" />
    <!-- Icon Mũ giáp chiến binh -->
    <path class="slot-icon" d="M 40 22 C 30 22 25 29 24 39 C 24 48 26 57 32 60 L 34 52 L 46 52 L 48 60 C 54 57 56 48 56 39 C 55 29 50 22 40 22 Z M 31 36 L 49 36 L 49 40 L 31 40 Z M 38 42 L 42 42 L 42 49 L 38 49 Z" />
  </g>

  <!-- ================= 2. ÁO GIÁP (ARMOR) ================= -->
  <g transform="translate(95, 10)">
    <use href="#base-slot" />
    <!-- Icon Áo giáp ngực -->
    <path class="slot-icon" d="M 33 22 C 37 26 43 26 47 22 L 56 26 L 59 36 L 52 38 L 54 58 L 26 58 L 28 38 L 21 36 L 24 26 Z M 38 31 L 42 31 L 42 45 L 38 45 Z M 34 47 L 46 47 L 44 54 L 36 54 Z" />
  </g>

  <!-- ================= 3. VŨ KHÍ (WEAPON) ================= -->
  <g transform="translate(180, 10)">
    <use href="#base-slot" />
    <!-- Icon Thanh kiếm chéo -->
    <path class="slot-icon" d="M 54 23 L 57 26 L 39 44 L 37 42 Z M 36 45 L 39 48 L 37 50 L 38 53 L 35 54 L 34 52 L 27 59 L 23 55 L 30 48 L 28 47 L 29 44 L 32 45 L 34 43 Z M 55 22 L 58 22 L 58 25 Z" />
  </g>

  <!-- ================= 4. KHIÊN (SHIELD) ================= -->
  <g transform="translate(265, 10)">
    <use href="#base-slot" />
    <!-- Icon Khiên đỡ -->
    <path class="slot-icon" d="M 40 22 C 48 24 53 23 56 25 C 56 38 54 51 40 59 C 26 51 24 38 24 25 C 27 23 32 24 40 22 Z M 40 28 C 34 35 32 40 32 48 C 36 51 38 52 40 54 C 42 52 44 51 48 48 C 48 40 46 35 40 28 Z" />
  </g>

  <!-- ================= 5. GIÀY (BOOTS) ================= -->
  <g transform="translate(350, 10)">
    <use href="#base-slot" />
    <!-- Icon Đôi giày chiến binh -->
    <path class="slot-icon" d="M 33 24 L 43 24 L 42 38 L 47 43 L 54 44 C 55 49 54 53 54 55 L 26 55 C 26 51 28 48 31 46 L 35 44 Z M 35 30 L 41 30 L 41 33 L 35 33 Z M 34 36 L 42 36 L 42 39 L 34 39 Z" />
  </g>

  <!-- ================= 6. ÁO CHOÀNG (CLOAK) ================= -->
  <g transform="translate(435, 10)">
    <use href="#base-slot" />
    <!-- Icon Áo choàng / Khăn quàng -->
    <path class="slot-icon" d="M 32 23 C 37 25 43 25 48 23 C 53 25 55 30 52 35 C 50 34 49 33 46 33 L 56 57 L 45 54 L 40 43 L 35 54 L 24 57 L 34 33 C 31 33 30 34 28 35 C 25 30 27 25 32 23 Z M 38 27 C 38 29 42 29 42 27 Z" />
  </g>

  <!-- ================= 7. BÌNH THUỐC (POTION) ================= -->
  <g transform="translate(520, 10)">
    <use href="#base-slot" />
    <!-- Icon Bình thuốc ma thuật -->
    <path class="slot-icon" d="M 37 23 L 43 23 L 43 26 L 45 28 L 45 32 L 52 41 C 56 46 54 56 46 57 L 34 57 C 26 56 24 46 28 41 L 35 32 L 35 28 L 37 26 Z M 35 42 C 34 47 36 51 40 52 C 44 51 46 47 45 42 Z" />
  </g>

  <!-- ================= 8. THỨC ĂN (FOOD) ================= -->
  <g transform="translate(605, 10)">
    <use href="#base-slot" />
    <!-- Icon Đùi thịt (Meat / Food) -->
    <path class="slot-icon" d="M 44 23 C 51 24 57 30 55 37 C 54 44 48 48 41 47 L 37 51 C 36 50 34 50 33 51 C 32 52 31 54 32 56 C 30 57 28 57 27 55 C 25 54 25 51 27 49 C 26 48 25 45 27 44 C 29 43 31 43 32 45 L 36 41 C 34 34 37 25 44 23 Z M 44 29 C 43 31 44 33 46 33 C 48 33 49 31 48 29 C 47 27 45 27 44 29 Z" />
  </g>
</svg>
